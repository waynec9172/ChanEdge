name: p0_perf_15m_all
description: 15m 全期、全幣池（只留前 20 名過濾）的效能實驗，現行出場規則
signals:
  source: chan
  tf: 15m
  types: [second_buy, third_buy, second_sell, third_sell]
  donchian_n: null
filters:
  in_top20: true
  candidate_only: false
  gate_pass: false
  jev_min: null
  max_cost_r: null
  exclude_reemit: false
entry:
  mode: market_next_open
  limit: {price: signal_close, offset: 0.0, valid_bars: 4}
  confirm: {bars: 1, require_close_beyond: true}
stop:
  buffer_atr: 0.15
  round_to_tick: true
exit:
  preset: current
costs:
  taker_bps: 5
  maker_bps: 2
  slippage_bps: 1
